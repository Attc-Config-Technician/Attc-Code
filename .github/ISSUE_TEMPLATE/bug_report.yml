name: Bug report
description: Report a reproducible problem with Attc Code.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce the problem.
        If this is a security issue, do **not** open a public issue — use
        [private vulnerability reporting](https://github.com/Attc-Config-Technician/Attc-Code/security/advisories/new).

  - type: input
    id: version
    attributes:
      label: Attc Code version
      description: Shown in Settings, or the APK filename.
      placeholder: "5.17 (84)"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - GitHub Releases
        - Attc Code F-Droid repository
        - Built from source
        - Other
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 8, Android 15"
    validations:
      required: true

  - type: dropdown
    id: cli
    attributes:
      label: Which session were you starting?
      options:
        - Attc Code (opencode)
        - Claude Code
        - Codex
        - Kimi Code
        - Antigravity
        - Terminal
        - Not session-specific
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Attc Code
        2. Choose ...
        3. Tap ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Screenshots or a screen recording help a lot.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If possible, attach `adb logcat -d > logcat.txt` and the terminal output.
        Remove tokens, API keys and personal paths before attaching.
      render: text
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed API keys, tokens and private data from the report.
          required: true
