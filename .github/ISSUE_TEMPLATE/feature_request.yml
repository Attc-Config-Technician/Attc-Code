name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the change you would like to see.
        Small, focused proposals are easier to review.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Explain the workflow that is currently difficult or impossible.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Attc Code do differently?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Terminal and sessions
        - AI CLIs
        - Voice assistant
        - Shizuku / phone control
        - Installation and updates
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This request is about Attc Code itself, not a third-party CLI.
          required: true
