name: fdroid-build

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'native/**'
      - 'CHANGELOG.md'
      - 'tools/build-native.sh'
      - 'tools/build-fdroid.sh'
      - 'tools/build.sh'
      - '.github/workflows/fdroid-build.yml'

permissions:
  contents: read

jobs:
  unsigned-apk:
    name: NDK build (F-Droid path)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-33" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install Android NDK
        run: |
          curl -fsSL https://dl.google.com/android/repository/android-ndk-r28c-linux.zip -o /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d "$HOME"
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r28c" >> "$GITHUB_ENV"

      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^## ' CHANGELOG.md | sed -E 's/^## ([^ ]+).*/\1/')"
          fi
          line="$(grep -m1 "^## ${version} (" CHANGELOG.md)"
          code="${line#* (}"
          code="${code%%)*}"
          test -n "$version" && test -n "$code"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Build unsigned APK
        run: |
          bash tools/build-fdroid.sh "$VERSION_NAME" "$VERSION_CODE" "$ANDROID_HOME" "$ANDROID_NDK_HOME"

      - name: Verify APK contents
        run: |
          apk="dist/ATTC-CODE-$VERSION_NAME.apk"
          test -f "$apk"
          unzip -l "$apk" | grep -E 'classes\.dex|lib/arm64-v8a/(libproot|libproot-loader|libtalloc|libandroid-shmem|libpty)\.so'
          sha256sum "$apk"

      - uses: actions/upload-artifact@v4
        with:
          name: attc-code-${{ env.VERSION_NAME }}-unsigned
          path: dist/ATTC-CODE-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
