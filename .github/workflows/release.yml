name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release APK
        run: |
          test -f releases/ATTC-CODE-*.apk
          sha256sum releases/ATTC-CODE-*.apk
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            releases/ATTC-CODE-*.apk
            releases/SHA256SUMS
