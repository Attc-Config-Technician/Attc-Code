AutoName: Attc Code

Summary: Ubuntu 24.04 and AI coding CLIs on Android, with an offline wake word

Description: |
  Attc Code boots a real Ubuntu 24.04 arm64 userland on Android with proot —
  no root — and runs AI coding CLIs inside it: opencode with the Zen models,
  Claude Code, Antigravity, Codex, Kimi Code, or a plain terminal.

  Every cold start asks which CLI to launch; a warm session resumes where it
  left off. The terminal includes Termux-style extra keys, pinch-to-zoom,
  text selection, attachments, a sessions/files panel and a persistent
  foreground notification.

  With the voice assistant enabled, saying the configured wake phrase (default
  “Hey Attc”) with the screen off arms command capture. Wake-word detection is
  a personal, fully offline MFCC/DTW model built from three recordings; the
  recognised Turkish sentence is typed into the selected CLI session. With
  Shizuku installed, the bundled attc-ctl helper can open apps and control
  media through shell commands.

  Shizuku is optional and only needed for phone control. Root is not required.
  Speech-to-text uses the device recognition service and may go online;
  wake-word audio never leaves the phone.

RepoType: git
Repo: https://github.com/Attc-Config-Technician/Attc-Code.git

Builds:
  - versionName: '5.16'
    versionCode: 83
    commit: v5.16
    subdir: .
    disable: 'draft: build server needs the Termux proot runtime and headers; see fdroid/README.md'
    sudo:
      - apt-get update
      - apt-get install -y openjdk-17-jdk-headless zip unzip python3 curl
    build:
      - export ANDROID_JAR=$$SDK$$/platforms/android-28/android.jar
      - export PATH=$$SDK$$/build-tools/34.0.0:$$NDK$$/toolchain/bin:$$PATH
      - export TERMUX_PREFIX=$$TERMUX_PREFIX$$
      - VERSION_CODE=83 VERSION_NAME=5.16 OUT_DIR=$$OUT$$ DELIVER_DIR= bash tools/build.sh

